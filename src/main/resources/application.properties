spring.application.name=bank-lab
server.port=8080

# PostgreSQL Connection
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/banklab
spring.datasource.username=banklab_user
spring.datasource.password=${BANKLAB_DB_PASSWORD}

# Hibernate / JPA - Local Learning Only
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Database Health
management.health.db.enabled=true